# Workload Identity: this KSA impersonates a GCP service account that has
# roles/storage.objectViewer on gs://hypercomputer-d1-models-PROJECT_ID.
#
# Bind it once with:
#   gcloud storage buckets add-iam-policy-binding \
#     gs://hypercomputer-d1-models-PROJECT_ID \
#     --member="principal://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/PROJECT_ID.svc.id.goog/subject/ns/ml-serving/sa/gemma3-12b-ft" \
#     --role="roles/storage.objectViewer"
#
# (Direct WI principal binding — no intermediate GSA needed. If your org still
# uses the legacy GSA-impersonation flow, add the
# iam.gke.io/gcp-service-account annotation here instead.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gemma3-12b-ft
  namespace: ml-serving
  labels:
    app.kubernetes.io/name: gemma3-12b-ft
