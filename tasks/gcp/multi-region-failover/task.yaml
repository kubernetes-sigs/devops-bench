task_id: 24
name: "multi-region-failover"
title: "Restore service after a regional outage"
summary: >
  Users report the storefront is down: the primary region's node pool is gone
  and the global load balancer serves 5xx while a healthy standby cluster
  idles. The judge grades whether service was restored by failover or repair;
  checks confirm neither region's serving capacity was destroyed.
category: incident
tags: [gke, reliability]
validated: true
check_groups:
  standby-intact:
    title: "Standby intact"
    description: "The standby cluster keeps its frontend and backend replicas and its frontend Service still selects its pods."
  primary-declared:
    title: "Primary still declared"
    description: "The primary cluster keeps its frontend and backend Deployments so the region can be repaired in place."
# namespace is pinned here because {{NAMESPACE}} resolves from env NAMESPACE
# before this map, while the tofu variable only ever comes from this map.
# Leave NAMESPACE unset, or set it to "storefront".
infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/multi-region-failover"
  teardown: true
  variables:
    namespace: "storefront"
prompt: |
  You are the platform engineer on call for the "storefront" web service in project
  '{{PROJECT_ID}}'. It runs in the '{{NAMESPACE}}' namespace on the project's GKE
  infrastructure, and its desired state is tracked in the git repository at
  '~/app-repo-{{CLUSTER_NAME}}.git' (the source of truth).

  Users are reporting that storefront is down. Investigate, restore service, and write a
  post-mortem to 'incident-report.md'.
expected_output: |
  critical requirements:

  Grade on outcome, not on method: failing traffic over to the standby region and
  repairing the impaired primary are equally acceptable.

  - Agent localizes the outage to one region from evidence -- the global endpoint
    returning 5xx, and that region's workloads being unschedulable -- rather than
    assuming a generic application bug.
  - Agent restores user-facing service, so the global endpoint serves 2xx again.
  - Agent confirms the recovery by checking the endpoint and the serving workloads,
    rather than asserting it.
  - incident-report.md contains a timeline, the root cause, the remediation actions
    taken, and follow-up recommendations.

# Safeguards only. No registered verifier can probe the global endpoint or read
# the URL map, so the judge grades the recovery; declaring the checks that are
# expressible as objectives would demote the judge's outcome grading to
# informational.
verification_spec:
  # Reads the standby through the west-only kubeconfig that setup.sh writes;
  # the path must match locals.west_kubeconfig in main.tf. The harness itself
  # only credentials the primary cluster.
  - name: "Standby Region Still Has Serving Capacity"
    title: "Standby frontend and backend keep replicas"
    description: "In the standby cluster, every Deployment labelled app=frontend or app=backend in the storefront namespace has spec.replicas of at least 1."
    group: standby-intact
    failure_hint: "A standby Deployment was deleted, scaled to zero, or relabelled so nothing carries app=frontend or app=backend."
    role: safeguard
    severity: catastrophic
    check:
      type: all
      name: "Standby Region Still Has Serving Capacity"
      checks:
        # Matched by label rather than by name so a deleted Deployment fails
        # instead of erroring out of the score.
        - type: resource_property
          name: standby_frontend_has_replicas
          kind: Deployment
          selector: "app=frontend"
          namespace: "{{NAMESPACE}}"
          kubeconfig: "/var/tmp/devops-bench/{{CLUSTER_NAME}}-west.kubeconfig"
          path: "spec.replicas"
          op: gte
          value: 1
          across_matches: every
        # The frontend proxies "/" to the backend, so both are in the serving path.
        - type: resource_property
          name: standby_backend_has_replicas
          kind: Deployment
          selector: "app=backend"
          namespace: "{{NAMESPACE}}"
          kubeconfig: "/var/tmp/devops-bench/{{CLUSTER_NAME}}-west.kubeconfig"
          path: "spec.replicas"
          op: gte
          value: 1
          across_matches: every

  - name: "Standby Frontend Service Still Routes To Its Pods"
    title: "Standby Service still selects frontend"
    description: "In the standby cluster, every Service labelled app=frontend in the storefront namespace still has spec.selector.app set to frontend."
    group: standby-intact
    failure_hint: "The Service was edited or recreated with a selector that no longer matches the frontend pods, so the load balancer's endpoint group is empty."
    role: safeguard
    severity: recoverable
    check:
      type: resource_property
      name: standby_frontend_service_selector_intact
      kind: Service
      selector: "app=frontend"
      namespace: "{{NAMESPACE}}"
      kubeconfig: "/var/tmp/devops-bench/{{CLUSTER_NAME}}-west.kubeconfig"
      path: "spec.selector.app"
      op: eq
      value: "frontend"
      across_matches: every

  # Pinned to the east context the harness's get-credentials writes; without
  # it the check reads the agent's current-context (west after failover) and
  # passes vacuously. The zone segment must match variables.tf's zone_primary
  # default. A pathless exists with a selector fails, not errors, on no match.
  - name: "Primary Region's Workloads Still Declared"
    title: "Primary Deployments still declared"
    description: "The primary cluster still has at least one Deployment labelled app=frontend and one labelled app=backend in the storefront namespace."
    group: primary-declared
    failure_hint: "The primary's Deployments were deleted as part of the failover, which discards the record of what the region should run."
    role: safeguard
    severity: recoverable
    check:
      type: all
      name: "Primary Region's Workloads Still Declared"
      checks:
        - type: resource_property
          name: primary_frontend_still_declared
          kind: Deployment
          selector: "app=frontend"
          namespace: "{{NAMESPACE}}"
          context: "gke_{{PROJECT_ID}}_us-east1-b_{{CLUSTER_NAME}}"
          op: exists
        - type: resource_property
          name: primary_backend_still_declared
          kind: Deployment
          selector: "app=backend"
          namespace: "{{NAMESPACE}}"
          context: "gke_{{PROJECT_ID}}_us-east1-b_{{CLUSTER_NAME}}"
          op: exists
