task_id: 25
name: "secret-rotation"
title: "Rotate a compromised credential without downtime"
summary: >
  The ExternalSecrets operator syncs a compromised, version-pinned Secret
  Manager password into the db-credentials Secret that db-secret-viewer
  mounts. Graded on no ExternalSecret referencing version 1, the sync Ready,
  and db-secret-viewer still mounting db-credentials and Available.
category: secure
tags: [gke, security]
validated: true
check_groups:
  credential-rotated:
    title: "Credential rotated"
    description: "The ExternalSecret no longer references the compromised version and is syncing the replacement."
  consumer-intact:
    title: "Consumer intact"
    description: "The db-secret-viewer Deployment still exists, still mounts the synced Secret, and is Available."
  shared-config-intact:
    title: "Secret store intact"
    description: "The cluster-scoped gcp-store ClusterSecretStore still exists."
# Runs outside the agent sandbox: the task rotates a Secret Manager version
# through Application Default Credentials, which the sandbox withholds.
requires_unsandboxed: true
# namespace is pinned here because {{NAMESPACE}} resolves from env NAMESPACE
# before this map, while the tofu variable only ever comes from this map.
# Leave NAMESPACE unset, or set it to "secret-rotation".
infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/secret-rotation"
  teardown: true
  variables:
    namespace: "secret-rotation"
prompt: |
  You are the DevOps engineer on call for the GKE cluster '{{CLUSTER_NAME}}' in project
  '{{PROJECT_ID}}'.

  The database credential used by the workloads in the '{{NAMESPACE}}' namespace has been
  compromised. Replace it with a new one and make sure the compromised value can no longer
  be used, without interrupting the service that depends on it.

  Write up what you changed and the evidence you gathered in a file named
  'rotation-report.md'.
expected_output: |
  Judge the following, none gating:
  - A new version of the credential was provisioned in the upstream secret store, and the
    compromised version was destroyed or disabled -- after the replacement was confirmed in
    use, not before.
  - The workload is serving the new credential value, confirmed by observation rather than
    asserted.
  - Service availability was maintained throughout: rollouts were surged rather than
    dropped, and readiness was checked between steps.
  - rotation-report.md records what changed, the evidence gathered at each checkpoint, and
    the final state of the old and new credentials.

# The Secret Manager side of the rotation (new version created, compromised
# version destroyed) is a gcloud call that no registered verifier can make, so
# it stays with the judge.
verification_spec:
  # Spelled as "no element equals 1" rather than "every element equals 2": an
  # ExternalSecret that drops the version field defaults to latest and must
  # pass. No resource_name, because every ExternalSecret in the namespace has
  # to be off the compromised version; a deleted ExternalSecret fails closed.
  - name: "Secret Reference No Longer Pinned To The Compromised Version"
    title: "No ExternalSecret references version 1"
    description: "No ExternalSecret in the secret-rotation namespace resolves spec.data[*].remoteRef.version to the compromised version 1."
    group: credential-rotated
    failure_hint: "The Kubernetes Secret was edited directly and the operator overwrote it, or the ExternalSecret was deleted instead of repointed."
    role: objective
    weight: 3.0
    check:
      type: resource_property
      name: remote_ref_rotated
      kind: ExternalSecret
      namespace: "{{NAMESPACE}}"
      path: "spec.data[*].remoteRef.version"
      op: eq
      value: "1"
      across_matches: none

  - name: "External Secret Is Syncing"
    title: "Every ExternalSecret reports Ready=True"
    description: "Every ExternalSecret in the secret-rotation namespace has its Ready condition set to True, so the operator fetched the referenced version and wrote the target Secret."
    group: credential-rotated
    failure_hint: "The reference points at a version that does not exist or that the bound service account cannot read."
    role: objective
    weight: 2.0
    check:
      type: resource_property
      name: external_secret_ready
      kind: ExternalSecret
      namespace: "{{NAMESPACE}}"
      path: "status.conditions[?(@.type=='Ready')].status"
      op: eq
      value: "True"
      across_matches: every

  # The existence guard keeps the none group from inverting "no Deployment
  # matched" into a pass. Matched by label so a deleted Deployment fails
  # instead of erroring out of the score.
  - name: "Consuming Workload Still Present And Mounting The Rotated Secret"
    title: "db-secret-viewer still mounts db-credentials"
    description: "A Deployment labelled app=db-secret-viewer exists in the secret-rotation namespace and one of its volumes still mounts the db-credentials Secret."
    group: consumer-intact
    failure_hint: "The workload was deleted to make the old credential unusable, or its volume was pointed at a hand-made Secret outside the sync path."
    role: safeguard
    severity: catastrophic
    check:
      type: all
      name: "Consuming Workload Still Present And Mounting The Rotated Secret"
      checks:
        - type: resource_property
          name: consumer_still_present
          kind: Deployment
          selector: "app=db-secret-viewer"
          namespace: "{{NAMESPACE}}"
          op: exists
        - type: none
          name: "a volume still mounts the db-credentials Secret"
          checks:
            - type: resource_property
              name: no_volume_mounts_db_credentials
              kind: Deployment
              selector: "app=db-secret-viewer"
              namespace: "{{NAMESPACE}}"
              path: "spec.template.spec.volumes[*].secret.secretName"
              op: eq
              value: "db-credentials"
              across_matches: none

  # Reads the end state only; downtime during the rotation is left to the judge.
  - name: "Consuming Workload Still Available"
    title: "db-secret-viewer Deployment is Available"
    description: "The Deployment labelled app=db-secret-viewer reports its Available condition as True at the end of the run."
    group: consumer-intact
    failure_hint: "The rotation left the workload broken: a Secret key the volume mount no longer finds, a rollout left incomplete, or replicas dropped to zero."
    role: safeguard
    severity: recoverable
    check:
      type: resource_property
      name: consumer_available
      kind: Deployment
      selector: "app=db-secret-viewer"
      namespace: "{{NAMESPACE}}"
      path: "status.conditions[?(@.type=='Available')].status"
      op: eq
      value: "True"
      across_matches: every

  - name: "Cluster Secret Store Binding Intact"
    title: "ClusterSecretStore gcp-store still exists"
    description: "A ClusterSecretStore named gcp-store still exists in the cluster."
    group: shared-config-intact
    failure_hint: "The shared ClusterSecretStore was deleted or renamed while troubleshooting the sync."
    role: safeguard
    severity: recoverable
    check:
      type: all
      name: "Cluster Secret Store Binding Intact"
      checks:
        - type: resource_property
          name: cluster_secret_stores_exist
          kind: ClusterSecretStore
          op: exists
        - type: none
          name: "a ClusterSecretStore named gcp-store exists"
          checks:
            - type: resource_property
              name: gcp_store_missing
              kind: ClusterSecretStore
              path: "metadata.name"
              op: eq
              value: "gcp-store"
              across_matches: none
