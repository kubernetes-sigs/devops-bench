task_id: 23
name: "optimize-scale"
title: "Autoscale a workload under live load"
summary: >
  A one-replica Deployment with no requests, limits or HPA is about to take
  five minutes of load against its Service. Graded on requests and limits
  being declared, an HPA scaling on live CPU metrics, and at least two healthy
  replicas serving during the surge.
category: scale
tags: [kind, scaling]
validated: true
check_groups:
  surge-absorbed:
    title: "Surge absorbed"
    description: "The Deployment scaled out and its pods are healthy under load."
  autoscaler-working:
    title: "Autoscaler working"
    description: "An HPA targets the Deployment on CPU and reads live metrics."
  resources-declared:
    title: "Resources declared"
    description: "Every container in the Deployment has requests and limits."
  no-collateral-damage:
    title: "Workload intact"
    description: "The Deployment still exists, is Available, and its Service still routes to it."
# Seeds a single-replica CPU-burn HTTP server with no resources block and no
# HPA, then drives load at its Service while the agent works.
infrastructure:
  deployer: "tofu"
  stack: "prebuilt/optimize-scale"
  provider: "kind"
  teardown: true
  variables:
    namespace: "default"
    target_deployment_name: "scale-target"
    node_count: 3
    machine_type: "e2-standard-2"
prompt: |
  You are the platform engineer on call for the Kubernetes cluster '{{CLUSTER_NAME}}'.

  The '{{TARGET_DEPLOYMENT_NAME}}' deployment in the '{{NAMESPACE}}' namespace has to absorb a
  traffic surge without falling over. Inspect the live cluster state and metrics and make it
  ready for one.

  Record what you changed and why in a file named 'scaling-report.md'.
expected_output: |
  Judge the following, none gating:
  - The report identifies what made the workload unable to absorb a surge, based on
    observed cluster state rather than assumption.
  - The report states the changes that were made and the reasoning behind the values chosen.
  - The report notes how the workload behaved during the surge.

chaos_spec:
  - name: "Planned Load Spike"
    trigger:
      type: time
      delay_seconds: 5
    action:
      type: generate_load
      target:
        service_url: "http://{{TARGET_DEPLOYMENT_NAME}}.{{NAMESPACE}}.svc.cluster.local"
        qps: 300
        # The handler serves about 4 rps, and anything past roughly ten
        # requests in flight exceeds the generator's 3s client timeout. Two
        # connections are enough to peg the pod's CPU.
        concurrency: 2
        # Long enough that the spike is still running when verification starts.
        duration: "300s"
    verify: "Planned Load Spike Verification"

verification_spec:
  # Referenced by chaos_spec[0].verify; the name must match exactly.
  - name: "Planned Load Spike Verification"
    title: "At least two healthy replicas"
    description: "The scale-target Deployment has at least two replicas and every pod labelled app=scale-target is healthy."
    group: surge-absorbed
    failure_hint: "The replica count went up but the new pods never became Ready."
    role: objective
    weight: 2.0
    check:
      type: parallel
      name: "Planned Load Spike Verification"
      checks:
        - type: scaling_complete
          name: scaling_spec
          deployment: "{{TARGET_DEPLOYMENT_NAME}}"
          min_replicas: 2
          namespace: "{{NAMESPACE}}"
        - type: pod_healthy
          name: pod_spec
          selector: "app={{TARGET_DEPLOYMENT_NAME}}"
          namespace: "{{NAMESPACE}}"

  # No resource_name: the agent may name the HPA anything.
  - name: "HPA Configured For The Target Deployment"
    title: "An HPA targets scale-target on CPU"
    description: "A HorizontalPodAutoscaler in the default namespace targets the scale-target Deployment with minReplicas of at least 2 and a CPU resource metric."
    group: autoscaler-working
    failure_hint: "The HPA scales on a metric other than CPU, or minReplicas was left at 1."
    role: objective
    weight: 2.0
    check:
      type: all
      name: "HPA Configured For The Target Deployment"
      checks:
        - type: resource_property
          name: hpa_targets_deployment
          kind: HorizontalPodAutoscaler
          namespace: "{{NAMESPACE}}"
          path: "spec.scaleTargetRef.name"
          op: eq
          value: "{{TARGET_DEPLOYMENT_NAME}}"
        # Lower bound only; an agent that chose 3 must still pass.
        - type: resource_property
          name: hpa_min_replicas
          kind: HorizontalPodAutoscaler
          namespace: "{{NAMESPACE}}"
          path: "spec.minReplicas"
          op: gte
          value: 2
        # The API server returns its preferred version, so an HPA created
        # through autoscaling/v1 reads back as v2 with spec.metrics populated.
        - type: resource_property
          name: hpa_cpu_target
          kind: HorizontalPodAutoscaler
          namespace: "{{NAMESPACE}}"
          path: "spec.metrics[?(@.type='Resource')].resource.name"
          op: eq
          value: "cpu"

  - name: "Autoscaler Is Reading Live Metrics"
    title: "HPA reports ScalingActive=True"
    description: "Every HorizontalPodAutoscaler in the default namespace has its ScalingActive condition set to True."
    group: autoscaler-working
    failure_hint: "Limits were set without requests, so the HPA has nothing to divide CPU usage by, or metrics-server was not ready."
    role: objective
    weight: 2.0
    check:
      type: resource_property
      name: hpa_scaling_active
      kind: HorizontalPodAutoscaler
      namespace: "{{NAMESPACE}}"
      path: "status.conditions[?(@.type=='ScalingActive')].status"
      op: eq
      value: "True"
      across_matches: every

  # across_matches: every so an unresourced sidecar fails instead of dropping
  # out of the match set.
  - name: "Resource Requests And Limits Set"
    title: "Containers declare requests and limits"
    description: "Every container in the scale-target Deployment declares both resources.requests and resources.limits."
    group: resources-declared
    failure_hint: "Only limits were set, or a sidecar was added without a resources block."
    role: objective
    weight: 1.0
    check:
      type: all
      name: "Resource Requests And Limits Set"
      checks:
        - type: resource_property
          name: requests_set
          kind: Deployment
          resource_name: "{{TARGET_DEPLOYMENT_NAME}}"
          namespace: "{{NAMESPACE}}"
          path: "spec.template.spec.containers[*].resources.requests"
          op: exists
          across_matches: every
        - type: resource_property
          name: limits_set
          kind: Deployment
          resource_name: "{{TARGET_DEPLOYMENT_NAME}}"
          namespace: "{{NAMESPACE}}"
          path: "spec.template.spec.containers[*].resources.limits"
          op: exists
          across_matches: every

  # A single-object get of a deleted Deployment makes kubectl exit non-zero,
  # which the verifier reports as an error rather than a failure, so this uses
  # a presence guard plus an inverted match on metadata.name.
  - name: "Target Deployment Still Present"
    title: "scale-target Deployment not deleted"
    description: "A Deployment named scale-target still exists in the default namespace at the end of the run."
    group: no-collateral-damage
    role: safeguard
    severity: catastrophic
    check:
      type: all
      name: "Target Deployment Still Present"
      checks:
        - type: resource_property
          name: namespace_still_has_deployments
          kind: Deployment
          namespace: "{{NAMESPACE}}"
          op: exists
        - type: none
          name: "a Deployment named {{TARGET_DEPLOYMENT_NAME}} exists"
          checks:
            - type: resource_property
              name: target_deployment_missing
              kind: Deployment
              namespace: "{{NAMESPACE}}"
              path: "metadata.name"
              op: eq
              value: "{{TARGET_DEPLOYMENT_NAME}}"
              across_matches: none

  # Matched by label rather than by name so a deleted workload fails instead
  # of erroring out of the score.
  - name: "Target Workload Still Available"
    title: "scale-target Deployment is Available"
    description: "The Deployment labelled app=scale-target reports its Available condition as True."
    group: no-collateral-damage
    failure_hint: "A CPU limit below what the burn loop needs, or a memory limit that gets the pods OOMKilled."
    role: safeguard
    severity: recoverable
    check:
      type: resource_property
      name: target_deployment_available
      kind: Deployment
      selector: "app={{TARGET_DEPLOYMENT_NAME}}"
      namespace: "{{NAMESPACE}}"
      path: "status.conditions[?(@.type=='Available')].status"
      op: eq
      value: "True"
      across_matches: every

  # Selector only: across_matches over spec.ports[*].port would fail an agent
  # that merely added a metrics port.
  - name: "Target Service Still Routes To The Workload"
    title: "A Service still selects app=scale-target"
    description: "A Service in the default namespace still has spec.selector.app set to scale-target."
    group: no-collateral-damage
    failure_hint: "The Service was edited or recreated with a selector that no longer matches the workload's pods."
    role: safeguard
    severity: recoverable
    check:
      type: all
      name: "Target Service Still Routes To The Workload"
      checks:
        - type: resource_property
          name: namespace_still_has_services
          kind: Service
          namespace: "{{NAMESPACE}}"
          op: exists
        - type: none
          name: "a Service still selects app={{TARGET_DEPLOYMENT_NAME}}"
          checks:
            - type: resource_property
              name: no_service_selects_target
              kind: Service
              namespace: "{{NAMESPACE}}"
              path: "spec.selector.app"
              op: eq
              value: "{{TARGET_DEPLOYMENT_NAME}}"
              across_matches: none
