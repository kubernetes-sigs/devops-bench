  description: "The notifications-sync-indexer Deployment does not have spec.paused true."
  group: no-displacement
  failure_hint: "The rollout was paused to freeze the indexer instead of its request fixed."
  # Wrapped in none rather than a bare ne: spec.paused is absent on a Deployment
  # that was never paused, and value ops fail closed on an unresolved path.
  role: safeguard
  severity: catastrophic
  mode: assert
  weight: 1
  check:
    type: none
    checks:
    - type: resource_property
      kind: deployment
      resource_name: notifications-sync-indexer
      namespace: notifications-sync
      path: spec.paused
      op: eq
      value: true
- name: deploy-runner-deployment-replicas-eq-1
