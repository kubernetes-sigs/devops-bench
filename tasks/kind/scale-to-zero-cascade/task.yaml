    resource_name: notifications-sync-compute
    namespace: notifications-sync
    path: spec.hard["requests.memory"]
    op: eq
    value: "400Mi"
- name: backend-not-eliminated
  title: "backend keeps three replicas"
  description: "The notifications-sync-backend Deployment still has spec.replicas 3."
  group: no-displacement
