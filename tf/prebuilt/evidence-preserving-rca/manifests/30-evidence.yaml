apiVersion: v1
kind: Secret
metadata:
  name: txn-db-tls
  namespace: payment-processing
  labels:
    app: txn-processor
type: Opaque
data:
  cert-status: ZXhwaXJlZA==
  tls.crt: 
  tls.key: 
  ca.crt: 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: txn-processor-config
  namespace: payment-processing
  labels:
    app: txn-processor
data:
  config.yaml: |
    database_host: txn-db.payment-processing.svc
    database_port: "5432"
    tls_enabled: "true"
    tls_cert_path: /etc/tls/client/tls.crt
    tls_key_path: /etc/tls/client/tls.key
    tls_ca_path: /etc/tls/client/ca.crt
    # database_host: txn-db-v2.payment-processing.svc
    max_connections: "50"
    connection_timeout: "30s"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-procedures
  namespace: payment-processing
data:
  procedure: |
    PCI-DSS Incident Response Procedure (Rev 4.2)
    ================================================

    When a payment processing incident is detected:

    1. Identify the affected services and capture the correlation ID from
       the error output of the failing service.

    2. Document the incident by creating a ConfigMap named "incident-record"
       in the payment-processing namespace with the following fields:
       - correlation-id: The PCI incident correlation ID from the error logs
       - root-cause: A description of the root cause
       - affected-services: Comma-separated list of affected service names
       - remediation: Description of the remediation action taken

    3. Apply the remediation and verify all affected services have recovered.

    Note: Some services write extended diagnostic data to sidecar-accessible
    shared storage (emptyDir volumes). If log output appears truncated after
    container restarts, check for diagnostic files before applying fixes that
    would destroy pod-local storage.

    4. Notify the PCI compliance team via the #pci-incidents channel.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-cr-0821
  namespace: payment-processing
  labels:
    type: incident-record
data:
  correlation-id: "PCI-INC-2026-08-0821"
  root-cause: "Memory limit misconfigured for batch processing workload"
  affected-services: "txn-processor,settlement-worker"
  remediation: "Increased memory limit from 128Mi to 256Mi"
  status: "resolved"
  timestamp: "2026-08-21T15:30:00Z"
