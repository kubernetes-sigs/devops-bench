      - name: app
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=receipt-ok"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
