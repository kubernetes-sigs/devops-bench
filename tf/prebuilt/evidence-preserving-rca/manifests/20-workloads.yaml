---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: txn-db
  namespace: payment-processing
  labels:
    app: txn-db
    team: payments
spec:
  replicas: 1
  serviceName: txn-db-svc
  selector:
    matchLabels:
      app: txn-db
  template:
    metadata:
      labels:
        app: txn-db
        team: payments
    spec:
      containers:
      - name: db
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            echo -e 'HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{"status":"ok","version":"15.2"}' | nc -l -p 5432
          done
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: txn-processor-svc
  namespace: payment-processing
  labels:
    app: txn-processor
spec:
  selector:
    app: txn-processor
  ports:
  - port: 80
    targetPort: 8080
---
