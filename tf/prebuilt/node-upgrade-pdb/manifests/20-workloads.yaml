apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor
  namespace: fulfillment
  labels:
    app: order-processor
    owner: fulfillment-team
spec:
  replicas: 4
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
        owner: fulfillment-team
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: order-processor
              topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8080
        - -text=order-ok
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-processor-svc
  namespace: fulfillment
  labels:
    app: order-processor
spec:
  selector:
    app: order-processor
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-processor-pdb
  namespace: fulfillment
  labels:
    app: order-processor
  annotations:
    devops-bench.io/original-uid: "PLACEHOLDER"
    devops-bench.io/original-creation-timestamp: "PLACEHOLDER"
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: order-processor
---
