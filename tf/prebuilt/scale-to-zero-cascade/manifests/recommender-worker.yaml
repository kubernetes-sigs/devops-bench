apiVersion: v1
kind: Namespace
metadata:
  name: recommender-worker
  labels:
    app.kubernetes.io/managed-by: spike-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender-worker-preview
  namespace: recommender-worker
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: recommender-worker-preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommender-worker-preview
  template:
    metadata:
      labels:
        app: recommender-worker-preview
    spec:
      containers:
      - name: recommender-worker-preview
        image: "busybox:1.36"
        command:
        - sh
        - "-c"
        - "sleep 6; exit 1"
        resources:
          requests:
            cpu: "14m"
            memory: "21Mi"
          limits:
            cpu: "28m"
            memory: "42Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender-worker-stable
  namespace: recommender-worker
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: recommender-worker-stable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommender-worker-stable
  template:
    metadata:
      labels:
        app: recommender-worker-stable
    spec:
      containers:
      - name: recommender-worker-stable
        image: "nginx:1.25-alpine"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "35m"
            memory: "33Mi"
          limits:
            cpu: "70m"
            memory: "66Mi"
