apiVersion: v1
kind: Namespace
metadata:
  name: search-api
  labels:
    app.kubernetes.io/managed-by: spike-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api-caller
  namespace: search-api
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: search-api-caller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-api-caller
  template:
    metadata:
      labels:
        app: search-api-caller
    spec:
      containers:
      - name: search-api-caller
        image: "busybox:1.36"
        command:
        - sh
        - "-c"
        - "while true; do wget -q -O /dev/null -S http://notifications-sync-web.notifications-sync.svc.cluster.local/ 2>&1 | grep HTTP; sleep 2; done"
        resources:
          requests:
            cpu: "24m"
            memory: "23Mi"
          limits:
            cpu: "48m"
            memory: "46Mi"
