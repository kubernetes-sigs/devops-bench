apiVersion: v1
kind: Namespace
metadata:
  name: recommender-api
  labels:
    app.kubernetes.io/managed-by: spike-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender-api-canary
  namespace: recommender-api
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: recommender-api-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommender-api-canary
  template:
    metadata:
      labels:
        app: recommender-api-canary
    spec:
      containers:
      - name: recommender-api-canary
        image: "busybox:1.36"
        command:
        - sh
        - "-c"
        - "sleep 11; exit 1"
        resources:
          requests:
            cpu: "46m"
            memory: "51Mi"
          limits:
            cpu: "92m"
            memory: "102Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender-api-stable
  namespace: recommender-api
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: recommender-api-stable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommender-api-stable
  template:
    metadata:
      labels:
        app: recommender-api-stable
    spec:
      containers:
      - name: recommender-api-stable
        image: "nginx:1.25-alpine"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "33m"
            memory: "55Mi"
          limits:
            cpu: "66m"
            memory: "110Mi"
