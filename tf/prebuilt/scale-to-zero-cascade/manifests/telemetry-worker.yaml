apiVersion: v1
kind: Namespace
metadata:
  name: telemetry-worker
  labels:
    app.kubernetes.io/managed-by: spike-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-worker-experimental
  namespace: telemetry-worker
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: telemetry-worker-experimental
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-worker-experimental
  template:
    metadata:
      labels:
        app: telemetry-worker-experimental
    spec:
      containers:
      - name: telemetry-worker-experimental
        image: "busybox:1.36"
        command:
        - sh
        - "-c"
        - "sleep 14; exit 1"
        resources:
          requests:
            cpu: "20m"
            memory: "39Mi"
          limits:
            cpu: "40m"
            memory: "78Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-worker-stable
  namespace: telemetry-worker
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: telemetry-worker-stable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-worker-stable
  template:
    metadata:
      labels:
        app: telemetry-worker-stable
    spec:
      containers:
      - name: telemetry-worker-stable
        image: "nginx:1.25-alpine"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "19m"
            memory: "21Mi"
          limits:
            cpu: "38m"
            memory: "42Mi"
