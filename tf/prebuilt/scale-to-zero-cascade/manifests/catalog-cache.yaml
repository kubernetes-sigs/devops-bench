apiVersion: v1
kind: Namespace
metadata:
  name: catalog-cache
  labels:
    app.kubernetes.io/managed-by: spike-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-cache-client
  namespace: catalog-cache
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: catalog-cache-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-cache-client
  template:
    metadata:
      labels:
        app: catalog-cache-client
    spec:
      containers:
      - name: catalog-cache-client
        image: "busybox:1.36"
        command:
        - sh
        - "-c"
        - "while true; do wget -q -O /dev/null -S http://notifications-sync-web.notifications-sync.svc.cluster.local/ 2>&1 | grep HTTP; sleep 10; done"
        resources:
          requests:
            cpu: "22m"
            memory: "48Mi"
          limits:
            cpu: "44m"
            memory: "96Mi"
