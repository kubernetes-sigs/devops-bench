# Security policy: containers must not run privileged. Audit mode so existing
# violations are *reported* (PolicyReports) rather than blocked; the agent must
# detect and remediate them. (The agent may flip this to Enforce to prevent
# future violations.)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  # Read by the policy-engine-not-dismantled safeguard, which selects by label
  # rather than by name: `kubectl get clusterpolicy <name>` exits non-zero on a
  # deleted object, which the runner records as status "error" and rollup then
  # skips, so a dismantled policy engine would vanish from the gate instead of
  # tripping it. A label selector returns an empty list, which fails closed.
  labels:
    devops-bench.io/policy: disallow-privileged-containers
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - kyverno
                - local-path-storage
      validate:
        message: "Privileged containers are not allowed (set securityContext.privileged to false)."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
