apiVersion: v1
kind: Namespace
metadata:
  name: team-gamma
  labels:
    owner: gamma-team
    env: non-prod
---
# VIOLATION (governance): no resource limits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: team-gamma
  labels:
    app: worker
    owner: gamma-team
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
# COMPLIANT (control / noise): not privileged, has limits: should NOT be flagged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: team-gamma
  labels:
    app: api
    owner: gamma-team
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.25@sha256:a484819eb60211f5299034ac80f6a681b06f89e65866ce91f356ed7c72af059c
          securityContext:
            privileged: false
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
