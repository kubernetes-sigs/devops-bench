apiVersion: apps/v1
kind: Deployment
metadata:
  name: waybill
  namespace: freight
  labels:
    app: waybill
    owner: freight-team
spec:
  replicas: 4
  selector:
    matchLabels:
      app: waybill
  template:
    metadata:
      labels:
        app: waybill
        owner: freight-team
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8080
        - -text=ok
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: waybill
  namespace: freight
  labels:
    app: waybill
    owner: freight-team
spec:
  selector:
    app: waybill
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifests
  namespace: freight
  labels:
    app: manifests
    owner: logistics-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: manifests
  template:
    metadata:
      labels:
        app: manifests
        owner: logistics-team
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8081
        - -text=ok
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: manifests
  namespace: freight
  labels:
    app: manifests
    owner: logistics-team
spec:
  selector:
    app: manifests
  ports:
  - port: 80
    targetPort: 8081
---
