apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier
  namespace: dispatch
  labels:
    app: courier
    owner: dispatch-team
spec:
  replicas: 4
  selector:
    matchLabels:
      app: courier
  template:
    metadata:
      labels:
        app: courier
        owner: dispatch-team
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8080
        - -text=ok
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: courier
  namespace: dispatch
  labels:
    app: courier
    owner: dispatch-team
spec:
  selector:
    app: courier
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker
  namespace: dispatch
  labels:
    app: tracker
    owner: dispatch-team
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tracker
  template:
    metadata:
      labels:
        app: tracker
        owner: dispatch-team
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8081
        - -text=ok
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tracker
  namespace: dispatch
  labels:
    app: tracker
    owner: dispatch-team
spec:
  selector:
    app: tracker
  ports:
  - port: 80
    targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: courier-hpa
  namespace: dispatch
  labels:
    app: courier-hpa
    owner: dispatch-team
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: courier
  minReplicas: 4
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
