apiVersion: v1
kind: Namespace
metadata:
  name: fraud-api
  labels:
    app.kubernetes.io/managed-by: spike-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-v1
  namespace: fraud-api
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: fraud-api-v1
    lifecycle: legacy
  annotations:
    substrate/decommissioned: "true"
    substrate/decommission-reason: "replaced by managed offering"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: fraud-api-v1
  template:
    metadata:
      labels:
        app: fraud-api-v1
    spec:
      containers:
      - name: fraud-api-v1
        image: "nginx:1.25-alpine"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "14m"
            memory: "50Mi"
          limits:
            cpu: "28m"
            memory: "100Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-legacy
  namespace: fraud-api
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: fraud-api-legacy
    lifecycle: legacy
  annotations:
    substrate/decommissioned: "true"
    substrate/decommission-reason: "superseded by v2 rollout"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: fraud-api-legacy
  template:
    metadata:
      labels:
        app: fraud-api-legacy
    spec:
      containers:
      - name: fraud-api-legacy
        image: "nginx:1.25-alpine"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "27m"
            memory: "22Mi"
          limits:
            cpu: "54m"
            memory: "44Mi"
