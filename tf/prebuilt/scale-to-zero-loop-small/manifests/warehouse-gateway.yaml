apiVersion: v1
kind: Namespace
metadata:
  name: warehouse-gateway
  labels:
    app.kubernetes.io/managed-by: spike-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-gateway-managed
  namespace: warehouse-gateway
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: warehouse-gateway-managed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: warehouse-gateway-managed
  template:
    metadata:
      labels:
        app: warehouse-gateway-managed
    spec:
      containers:
      - name: warehouse-gateway-managed
        image: "nginx:1.25-alpine"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "15m"
            memory: "53Mi"
          limits:
            cpu: "30m"
            memory: "106Mi"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-gateway-desired-state
  namespace: warehouse-gateway
  labels:
    app.kubernetes.io/managed-by: spike-substrate
data:
  replicas: "2"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warehouse-gateway-controller
  namespace: warehouse-gateway
  labels:
    app.kubernetes.io/managed-by: spike-substrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warehouse-gateway-controller
  namespace: warehouse-gateway
  labels:
    app.kubernetes.io/managed-by: spike-substrate
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warehouse-gateway-controller
  namespace: warehouse-gateway
  labels:
    app.kubernetes.io/managed-by: spike-substrate
subjects:
- kind: ServiceAccount
  name: warehouse-gateway-controller
  namespace: warehouse-gateway
roleRef:
  kind: Role
  name: warehouse-gateway-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: warehouse-gateway-controller
  namespace: warehouse-gateway
  labels:
    app.kubernetes.io/managed-by: spike-substrate
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: warehouse-gateway-controller-job
            image: "bitnamilegacy/kubectl:1.29"
            command:
            - sh
            - "-c"
            - "kubectl -n warehouse-gateway scale deployment/warehouse-gateway-managed --replicas=$(cat /etc/desired/replicas)"
            volumeMounts:
            - name: desired
              mountPath: "/etc/desired"
            resources:
              requests:
                cpu: "32m"
                memory: "41Mi"
              limits:
                cpu: "64m"
                memory: "82Mi"
          restartPolicy: Never
          volumes:
          - name: desired
            configMap:
              name: warehouse-gateway-desired-state
          serviceAccountName: warehouse-gateway-controller
