apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier
  namespace: dispatch
  labels:
    app: courier
    owner: dispatch-team
spec:
  replicas: 4
  selector:
    matchLabels:
      app: courier
  template:
    metadata:
      labels:
        app: courier
        owner: dispatch-team
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8080
        - -text=ok
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: courier
  namespace: dispatch
  labels:
    app: courier
    owner: dispatch-team
spec:
  selector:
    app: courier
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker
  namespace: dispatch
  labels:
    app: tracker
    owner: dispatch-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracker
  template:
    metadata:
      labels:
        app: tracker
        owner: dispatch-team
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args:
        - -listen=:8081
        - -text=ok
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tracker
  namespace: dispatch
  labels:
    app: tracker
    owner: dispatch-team
spec:
  selector:
    app: tracker
  ports:
  - port: 80
    targetPort: 8081
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-agent
  namespace: bench-system
  labels:
    acme.io/purpose: bench-agent-sandbox-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bench-agent-access
  namespace: dispatch
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - endpoints
  - configmaps
  - events
  - resourcequotas
  - limitranges
  - persistentvolumeclaims
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bench-agent-access-binding
  namespace: dispatch
subjects:
- kind: ServiceAccount
  name: bench-agent
  namespace: bench-system
roleRef:
  kind: Role
  name: bench-agent-access
  apiGroup: rbac.authorization.k8s.io
