apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payments
  labels:
    app: payment-gateway
    owner: payments-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
        owner: payments-team
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: payment-gateway
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway-svc
  namespace: payments
  labels:
    app: payment-gateway
spec:
  selector:
    app: payment-gateway
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-gateway-pdb
  namespace: payments
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app: checkout-api
    owner: payments-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        owner: payments-team
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: checkout-api
      containers:
      - name: app
        image: nginx:1.27-alpine
        env:
        - name: SETTLEMENT_QUEUE_URL
          value: "http://settlement-queue-svc.payments.svc:8080/enqueue"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api-svc
  namespace: payments
  labels:
    app: checkout-api
spec:
  selector:
    app: checkout-api
  ports:
  - port: 80
    targetPort: 80
---
# Backed solely by the unmanaged settlement-relay pod (seeded by
# setup.sh). No controller owns that pod: if it is evicted or deleted,
# nothing recreates it and this Service loses its only endpoint.
apiVersion: v1
kind: Service
metadata:
  name: settlement-queue-svc
  namespace: payments
  labels:
    app: settlement-relay
spec:
  selector:
    app: settlement-relay
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout-api-pdb
  namespace: payments
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: checkout-api
