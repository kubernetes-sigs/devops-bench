apiVersion: v1
kind: Namespace
metadata:
  name: identity-gateway
  labels:
    app.kubernetes.io/managed-by: spike-substrate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-gateway-relay
  namespace: identity-gateway
  labels:
    app.kubernetes.io/managed-by: spike-substrate
    app: identity-gateway-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-gateway-relay
  template:
    metadata:
      labels:
        app: identity-gateway-relay
    spec:
      containers:
      - name: identity-gateway-relay
        image: "busybox:1.36"
        command:
        - sh
        - "-c"
        - "while true; do wget -q -O /dev/null -S http://notifications-sync-web.notifications-sync.svc.cluster.local/ 2>&1 | grep HTTP; sleep 6; done"
        resources:
          requests:
            cpu: "35m"
            memory: "55Mi"
          limits:
            cpu: "70m"
            memory: "110Mi"
