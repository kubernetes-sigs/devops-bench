apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-sender
  namespace: accounts
  labels:
    app: notification-sender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-sender
  template:
    metadata:
      labels:
        app: notification-sender
    spec:
      containers:
        - name: notification-sender
          image: busybox:1.36
          command:
            - sh
            - -c
            - |-
              while true; do
                HOST=$(echo $SMTP_RELAY | cut -d: -f1)
                PORT=$(echo $SMTP_RELAY | cut -d: -f2)
                if nc -z -w2 "$HOST" "$PORT" 2>/dev/null; then
                  echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) OK: connected to $SMTP_RELAY"
                else
                  echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ERROR: connection refused to $SMTP_RELAY, notifications queued to /dev/null"
                fi
                sleep 30
              done
          resources:
            requests:
              memory: "96Mi"
            limits:
              memory: "128Mi"
          env:
            - name: SMTP_RELAY
              value: "smtp.internal:587"
