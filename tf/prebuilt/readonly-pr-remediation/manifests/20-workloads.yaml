apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payments
  labels:
    app: payment-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
        - name: payment-gateway
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
        - name: invoice-prober
          image: busybox:1.36
          command:
            - sh
            - -c
            - |-
              sleep 30
              while true; do
                if wget -q -O /dev/null -T 2 http://invoice-api.accounts.svc/ 2>/dev/null; then
                  echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) OK" >> /tmp/probe.log
                else
                  echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) FAIL" >> /tmp/probe.log
                fi
                sleep 5
              done
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "64Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-sync-sim
  namespace: ci-system
  labels:
    app: argocd-sync-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-sync-sim
  template:
    metadata:
      labels:
        app: argocd-sync-sim
    spec:
      serviceAccountName: argocd-sync-sim-sa
      containers:
        - name: sync
          image: busybox:1.36
          command:
            - sh
            - -c
            - |-
              while true; do sleep 3600; done
          env:
            - name: SYNC_INTERVAL_SEC
              value: "15"
            - name: SYNC_REPO_PATH
              value: "/home/user/accounts-gitops.git"
          resources:
            requests:
              memory: "16Mi"
            limits:
              memory: "32Mi"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-sync-status
  namespace: ci-system
data:
  last-commit-sha: "initial"
  last-sync-time: "pending"
  sync-result: "pending"
