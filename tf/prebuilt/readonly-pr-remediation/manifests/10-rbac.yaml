apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-agent-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bench-agent-readonly
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bench-agent-readonly
subjects:
  - kind: ServiceAccount
    name: bench-agent-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: bench-agent-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-sync-sim-sa
  namespace: ci-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-sync-accounts
  namespace: accounts
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-sync-accounts
  namespace: accounts
subjects:
  - kind: ServiceAccount
    name: argocd-sync-sim-sa
    namespace: ci-system
roleRef:
  kind: Role
  name: argocd-sync-accounts
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-sync-ci-status
  namespace: ci-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-sync-ci-status
  namespace: ci-system
subjects:
  - kind: ServiceAccount
    name: argocd-sync-sim-sa
    namespace: ci-system
roleRef:
  kind: Role
  name: argocd-sync-ci-status
  apiGroup: rbac.authorization.k8s.io
