apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-api
  namespace: logistics
  labels:
    app: shipment-api
    owner: logistics-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipment-api
  template:
    metadata:
      labels:
        app: shipment-api
        owner: logistics-team
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 750m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shipment-api-svc
  namespace: logistics
  labels:
    app: shipment-api
spec:
  selector:
    app: shipment-api
  ports:
  - port: 80
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-worker
  namespace: logistics
  labels:
    app: shipment-worker
    owner: logistics-team
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shipment-worker
  template:
    metadata:
      labels:
        app: shipment-worker
        owner: logistics-team
    spec:
      containers:
      - name: app
        image: nginx:1.26-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
