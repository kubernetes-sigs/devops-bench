apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-tracker
  namespace: logistics
  labels:
    app: inventory-tracker
    owner: logistics-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-tracker
  template:
    metadata:
      labels:
        app: inventory-tracker
        owner: logistics-team
    spec:
      containers:
      - name: app
        image: nginx:1.26-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
