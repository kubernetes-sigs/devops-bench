apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-api
  namespace: logistics
  labels:
    app: shipment-api
    owner: logistics-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipment-api
  template:
    metadata:
      labels:
        app: shipment-api
        owner: logistics-team
    spec:
      containers:
      - name: app
        image: nginx:1.26-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
